## {{ ansible_managed }}

[sssd]
domains = {{ domain }}
services = nss, pam

[domain/{{ domain }}]
# Users and groups are ordinary local accounts, managed with useradd/usermod,
# but only regular users at or above this ID are handled by SSSD
id_provider = proxy
proxy_lib_name = files
min_id = {{ sssd_uid_min }}

# Passwords are checked and changed by the KDC, rather than kept in /etc/shadow
auth_provider = krb5
chpass_provider = krb5
access_provider = permit

krb5_realm = {{ krb_realm }}
krb5_server = krb.{{ domain }}
krb5_kpasswd = krb.{{ domain }}

# Verify the TGT obtained at login against the host keytab, which guards
# against a spoofed KDC
krb5_validate = true

# Keep tickets obtained at login renewed for as long as the KDC allows
krb5_renewable_lifetime = 14d
krb5_renew_interval = 1h

# Allow logins using cached credentials if the KDC is unreachable
cache_credentials = true
