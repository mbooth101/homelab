- name: Install Certbot
  ansible.builtin.dnf:
    name:
      - certbot
    state: present

- name: Register Certbot ACME Account
  ansible.builtin.shell: |
    certbot -n register --agree-tos --no-eff-email --email webmaster@{{ domain }}
    touch /etc/letsencrypt/.registered
  args:
    creates: /etc/letsencrypt/.registered

- name: Enable/Start Certbot TLS Certificate Renewal Timer
  ansible.builtin.systemd_service:
    name: certbot-renew.timer
    enabled: true
    masked: no
    state: started

# Necessary in staging environment so the installed services can trust each
# other without having to disable any certificate validation settings
- name: Install Self-Signed Authority Certificate
  ansible.builtin.copy:
    src: CA.pem
    dest: /etc/pki/ca-trust/source/anchors/CA.pem
    mode: '0640'
  when: self_signed_certs

- name: Update System CA Trust Store
  ansible.builtin.command:
    cmd: update-ca-trust
  changed_when: false
  when: self_signed_certs
