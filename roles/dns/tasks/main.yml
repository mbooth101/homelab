- name: Install BIND
  ansible.builtin.dnf:
    name:
      - bind
      - bind-utils
    state: present

- name: Compute Reverse Pointer DNS Record Names
  ansible.builtin.set_fact:
    reverse_ptr4: "{{ host.netw4.split('.')[:3] | reverse | join('.') }}.in-addr.arpa"

- name: Allow BIND to Modify Files in the DB Root
  community.general.sefcontext:
    target: "{{ db_root }}(/.*)?"
    setype: named_zone_t
    state: present

- name: Create BIND Data Directory
  ansible.builtin.file:
    state: directory
    setype: "{{ item.setype }}"
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ db_root | dirname }}", setype: var_t, mode: '0755', owner: root, group: root }
    - { path: "{{ db_root }}", setype: named_zone_t, mode: '0770', owner: root, group: named }

# This ensures the FQDN is correctly set and "hostname -f" gives the right
# answer
- name: Update Hosts File
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item }}"
  loop:
    - "{{ host.addr4 }} {{ host.fqdn }} {{ host.name }}"

# Ensure the host name is set correctly based on the inventory host on which
# we're being run
- name: Set Host Name
  ansible.builtin.hostname:
    name: "{{ host.name }}"
    use: systemd

- name: Install Main DNS Configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: named
    mode: '0640'
  loop:
    - { src: named.conf, dest: /etc/named.conf }
    - { src: named.domains.conf, dest: /etc/named/domains.conf }
  notify:
    - Reload BIND DNS

# Other roles may add records to the DNS zones, so we only need to install
# if not already present, instead of overwriting when different
- name: Checking For Installed DNS Zone Files
  stat:
    path: "{{ db_root }}/{{ domain }}.zone"
  register: zone_config

- name: Install DNS Zone Configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ db_root }}/{{ item.dest }}"
    owner: root
    group: named
    mode: '0640'
  loop:
    - { src: "forward.zone", dest: "{{ domain }}.zone" }
    - { src: "reverse.zone", dest: "{{ reverse_ptr4 }}.zone" }
  when:
    - not zone_config.stat.exists
  notify:
    - Reload BIND DNS

# Disable the systemd stub listener in favour of BIND providing a
# local caching DNS resolver
- name: Disable DNS Stub Listener
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: 'DNSStubListener=yes'
    line: 'DNSStubListener=no'
  notify:
    - Restart Local Resolver

- name: Update Network Connection Settings
  community.general.nmcli:
    conn_name: bridge0
    autoconnect: true
    ip4: "{{ host.cidr4 }}"
    gw4: "{{ host.gate4 }}"
    dns4: "127.0.0.1"
    dns4_search: "{{ domain }}"
    dns6: "::1"
    dns6_search: "{{ domain }}"
    state: present
  register: net_config

# This causes systemd to rewrite the /etc/resolv.conf file to contain
# the updated DNS resolver details
- name: Reapply Network Connection Settings
  ansible.builtin.command:
    cmd: nmcli device reapply bridge0
  when: net_config.changed

- name: Enable/Start BIND DNS
  ansible.builtin.systemd_service:
    name: named.service
    enabled: true
    masked: no
    state: started

- name: Open Firewall for DNS
  ansible.posix.firewalld:
    service: dns
    permanent: true
    state: enabled
  notify:
    - Reload Firewall
