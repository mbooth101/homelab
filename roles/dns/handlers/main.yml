---
- name: Reload BIND DNS
  ansible.builtin.systemd_service:
    name: named.service
    daemon_reload: true
    state: reloaded

- name: Restart Resolver
  ansible.builtin.systemd_service:
    name: systemd-resolved.service
    daemon_reload: true
    state: restarted

- name: Reapply Network Configuration
  ansible.builtin.command:
    cmd: nmcli device reapply bridge0
  changed_when: false
