# Dynamic Zone Update Keys
include "/etc/named/{{ ddns_secret_name }}.key";

zone "{{ domain }}" IN {
	type master;
	file "{{ domain }}.zone";
	update-policy {
		grant {{ ddns_secret_name }} wildcard *.{{ domain }} A AAAA CNAME SRV TXT SSHFP DHCID;
	};
};

zone "{{ host.ipv4.cidr | ip_ptr }}" IN {
	type master;
	file "{{ host.ipv4.cidr | ip_ptr }}.zone";
	update-policy {
		grant {{ ddns_secret_name }} wildcard *.{{ host.ipv4.cidr | ip_ptr }} PTR DHCID;
	};
};

zone "{{ host.ipv6.cidr | ip_ptr }}" IN {
	type master;
	file "{{ host.ipv6.cidr | ip_ptr }}.zone";
	update-policy {
		grant {{ ddns_secret_name }} wildcard *.{{ host.ipv6.cidr | ip_ptr }} PTR DHCID;
	};
};

