# Dynamic Zone Update Keys
include "/etc/named/dhcp-ddns.key";

zone "{{ domain }}" IN {
	type master;
	file "{{ domain }}.zone";
	update-policy {
		grant dhcp-ddns wildcard *.{{ domain }} A AAAA CNAME SRV TXT DHCID;
	};
};

zone "{{ host.ipv4.cidr | ip_ptr }}" IN {
	type master;
	file "{{ host.ipv4.cidr | ip_ptr }}.zone";
	update-policy {
		grant dhcp-ddns wildcard *.{{ host.ipv4.cidr | ip_ptr }} PTR DHCID;
	};
};

zone "{{ host.ipv6.cidr | ip_ptr }}" IN {
	type master;
	file "{{ host.ipv6.cidr | ip_ptr }}.zone";
	update-policy {
		grant dhcp-ddns wildcard *.{{ host.ipv6.cidr | ip_ptr }} PTR DHCID;
	};
};

