## {{ ansible_managed }}

# Override the default nameserver configuration for this network

[Match]
Name=bridge0

[Network]
DNS=
DNS={{ host.ipv4.address }}
DNS={{ host.ipv6.address }}
Domains={{ domain }}

# Ignore nameservers advertised by the router
[IPv6AcceptRA]
UseDNS=no

# Ignore nameservers recieved from IPv6 DHCP servers
[DHCPv6]
UseDNS=no
