## {{ ansible_managed }}

WSGIDaemonProcess kdcproxy processes=2 threads=15 maximum-requests=5000 user=kdcproxy group=kdcproxy display-name=%{GROUP}
WSGIScriptAlias /KdcProxy /usr/local/share/kdcproxy/kdcproxy.wsgi
WSGIApplicationGroup %{GLOBAL}
WSGIProcessGroup kdcproxy
WSGIScriptReloading Off

<Location "/KdcProxy">
	Require all granted
</Location>

