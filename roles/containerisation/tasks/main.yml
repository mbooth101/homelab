- name: Install Podman
  ansible.builtin.dnf:
    name:
      - podman
      - podman-docker
    state: present

- name: Add Podman Group
  ansible.builtin.group:
    name: podman
    system: true
    state: present

- name: Ensure Podman Socket Overrides Directory
  ansible.builtin.file:
    state: directory
    path: /etc/systemd/system/podman.socket.d
    mode: '0755'

- name: Allow Podman Group To Use Podman Socket
  ansible.builtin.copy:
    content: |
      [Socket]
      SocketGroup=podman
      ExecStartPost=/usr/bin/chown root:podman /run/podman
      ExecStartPost=/usr/bin/chmod 0750 /run/podman
    dest: /etc/systemd/system/podman.socket.d/group.conf
    mode: '0644'
  notify:
    - Restart Podman Socket

- name: Enable/Start Podman
  ansible.builtin.systemd_service:
    name: podman.socket
    enabled: true
    masked: no
    state: started

- name: Install Podman Image Prune Service And Timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - podman-image-prune.service
    - podman-image-prune.timer

- name: Enable/Start Podman Image Prune Timer
  ansible.builtin.systemd_service:
    name: podman-image-prune.timer
    daemon_reload: true
    enabled: true
    masked: no
    state: started
