// This configuration file contains only DHCPv6 server's configuration.
// If configurations for other Kea services are also included in this file they
// are ignored by the DHCPv6 server.
{

"Dhcp6": {
    "interfaces-config": {
        "interfaces": [ "bond0/{{ host.ipv6.bond_ip }}" ]
    },

    "control-socket": {
        "socket-type": "unix",
        "socket-name": "/tmp/kea6-ctrl-socket"
    },

    "lease-database": {
        "type": "postgresql",
        "name": "{{ db_name }}",
        "user": "{{ db_user }}",
        "password": "{{ db_password }}",
        "host": "::1",
        "port": 5432
    },

    "hosts-database": {
        "type": "postgresql",
        "name": "{{ db_name }}",
        "user": "{{ db_user }}",
        "password": "{{ db_password }}",
        "host": "::1",
        "port": 5432
    },

    // Set long lease lifetimes and infrequent timers, our network is not
    // very dynamic and we don't need to be aggressive
    "renew-timer": 21600,
    "rebind-timer": 32400,
    "preferred-lifetime": 43200,
    "valid-lifetime": 43200,
    "expired-leases-processing": {
        "reclaim-timer-wait-time": 3600,
        "flush-reclaimed-timer-wait-time": 7200,
        "hold-reclaimed-time": 172800,
        "max-reclaim-leases": 0,
        "max-reclaim-time": 0,
        "unwarned-reclaim-cycles": 5
    },

    "subnet6": [
        {
            "id": 1,
            "subnet": "{{ host.ipv6.subnet }}",
            "pools": [
                // An arbitrary /96 sized pool of addresses from the subnet
                { "pool": "{{ host.ipv6.network | ansible.utils.ipmath(0x100000000) }}/96" }
            ],
            "interface": "bond0",
            "option-data": [
                {
                    // Name servers
                    "name": "dns-servers",
                    "data": "{{ host.ipv6.bond_ip }}"
                },
                {
                    // Search domains
                    "name": "domain-search",
                    "data": "{{ domain }}"
                }
            ],
            "reservation-mode": "all",
            "reservations": [
            ]
        }
    ],

    // DDNS information (how the DHCPv6 component can reach a DDNS daemon)
    "dhcp-ddns": {
        "enable-updates": true,
        "server-ip": "::1",
        "server-port": 53001,
        "sender-ip": "::1",
        "sender-port": 0,
        "max-queue-size": 1024
    },
    "ddns-send-updates": true,
    "ddns-qualifying-suffix": "{{ domain }}",
    "ddns-override-client-update": true,

    "loggers": [
        {
            // This specifies the logging for DHCPv6 daemon.
            "name": "kea-dhcp6",
            "output_options": [
                {
                    // Logs written to stdout will be captured by systemd
                    "output": "stdout",

                    // Shorter log pattern suitable for use with systemd,
                    // avoids redundant information
                    "pattern": "%-5p [%c] %m\n"
                }
            ],
            // This specifies the severity of log messages to keep. Supported values
            // are: FATAL, ERROR, WARN, INFO, DEBUG
            "severity": "INFO",

            // If DEBUG level is specified, this value is used. 0 is least verbose,
            // 99 is most verbose. Be cautious, Kea can generate lots and lots
            // of logs if told to do so.
            "debuglevel": 0
        }
    ]
}
}
