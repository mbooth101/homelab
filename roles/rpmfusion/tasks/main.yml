- name: Install Distro GPG Keys
  ansible.builtin.dnf:
    name: distribution-gpg-keys
    state: present

- name: Import GPG Key for RPMFusion Free Repository
  ansible.builtin.rpm_key:
    key: "/usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-{{ ansible_facts.distribution_major_version }}"
    state: present

- name: Import GPG Key for RPMFusion Non-Free Repository
  ansible.builtin.rpm_key:
    key: "/usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-nonfree-fedora-{{ ansible_facts.distribution_major_version }}"
    state: present

- name: Install RPMFusion Repositories
  ansible.builtin.dnf:
    name:
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts.distribution_major_version }}.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts.distribution_major_version }}.noarch.rpm
    state: present
