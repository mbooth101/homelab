- name: Install Distro GPG Keys
  ansible.builtin.dnf:
    name: distribution-gpg-keys
    state: present

- name: Import GPG Key for RPMFusion Free Repository
  ansible.builtin.rpm_key:
    key: /usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-43
    state: present

- name: Import GPG Key for RPMFusion Non-Free Repository
  ansible.builtin.rpm_key:
    key: /usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-nonfree-fedora-43
    state: present

- name: Install RPMFusion Repositories
  ansible.builtin.dnf:
    name:
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-43.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-43.noarch.rpm
    state: present
