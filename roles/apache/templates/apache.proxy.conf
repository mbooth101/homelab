## {{ ansible_managed }}

ProxyPass "/" "http://[::1]:{{ http_port }}/"
ProxyPassReverse "/" "http://[::1]:{{ http_port }}/"

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto 'https' env=HTTPS
RequestHeader set X-Forwarded-Host '{{ site_name | default(role_name) }}.{{ domain }}'

# Allow for upgrading to websocket connections
RewriteEngine On
RewriteCond %{HTTP:Connection} Upgrade [NC]
RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteRule /(.*) ws://[::1]:{{ http_port }}/$1 [P,L]

