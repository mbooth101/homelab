- name: Configure Apache for OpenHAB
  ansible.builtin.include_tasks:
    file: ../../apache/tasks/configure-site.yml
  vars:
    site_proxy: true

- name: Import GPG Key for OpenHAB Repository
  ansible.builtin.rpm_key:
    key: https://openhab.jfrog.io/artifactory/api/gpg/key/public
    state: present

- name: Enable OpenHAB Repository
  ansible.builtin.copy:
    src: openhab.repo
    dest: /etc/yum.repos.d/openhab.repo
    mode: '0644'

- name: Install OpenHAB
  ansible.builtin.dnf:
    name:
      - java-21-openjdk-headless
      - openhab
    state: present

- name: Create OpenHAB Data Directory
  ansible.builtin.file:
    state: directory
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: '0755'
  loop:
    - { path: "{{ data_dir | dirname }}", owner: root }
    - { path: "{{ data_dir }}", owner: openhab }

# These files will be altered by the running service, so only do
# it once to avoid overwriting user data
- name: Checking For Installed OpenHAB Data Files
  ansible.builtin.stat:
    path: "{{ data_dir }}/etc"
  register: openhab_config

- name: Install OpenHAB Data Files
  ansible.builtin.copy:
    src: "/var/lib/openhab/{{ item }}/"
    dest: "{{ data_dir }}/{{ item }}"
    owner: openhab
    group: openhab
    mode: preserve
    remote_src: true
  loop:
    - etc
    - persistence
  when:
    - not openhab_config.stat.exists

- name: Configure OpenHAB Embedded SSH Server
  ansible.builtin.lineinfile:
    path: "{{ data_dir }}/etc/org.apache.karaf.shell.cfg"
    regexp: "{{ item.re }}"
    line: "{{ item.line }}"
  loop:
    - { re: "^sshPort", line: "sshPort = 2222" }
    - { re: "^sshHost", line: "sshHost = ::1" }
  notify:
    - Restart OpenHAB

- name: Ensure OpenHAB Service Overrides Directory
  ansible.builtin.file:
    state: directory
    path: /etc/systemd/system/openhab.service.d
    mode: '0755'

- name: Install OpenHAB Service Overrides
  ansible.builtin.template:
    src: openhab.override.conf
    dest: "/etc/systemd/system/openhab.service.d/override.conf"
    mode: '0644'
  notify:
    - Restart OpenHAB

- name: Enable/Start OpenHAB
  ansible.builtin.systemd_service:
    name: openhab.service
    enabled: true
    masked: no
    state: started

