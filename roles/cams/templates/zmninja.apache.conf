## {{ ansible_managed }}

# zmNinjaNg ignores HTTP authentication headers, which means it cannot handle
# Negotiate (kerberos ticket) or Basic (username/password) authentication
# schemes that are provided by Apache.
#
# It relies on Zoneminder's internal user authentication mechanism, which
# means we must add exceptions to the Apache authenticatin coverage to:
#  * let requests thru that get an auth token from Zoneminder
#  * and then let requests thru containing the auth token
#
# The API's rewrite rules internally redirect everything to .../index.php, so
# paths are matched against the original request line (THE_REQUEST) rather
# than REQUEST_URI.

# The version check the app makes before logging in, must be publicly
# available for everyone
<If "%{THE_REQUEST} =~ m#^GET /zm/api/host/getVersion\.json[? ]#">
	Require all granted
</If>

# Login and token refresh, with app specific credentials in the POST body
# to get the auth token
<If "%{THE_REQUEST} =~ m#^POST /zm/api/host/login\.json[? ]#">
	Require all granted
</If>

# Anything carrying an auth token in the query string
<If "%{QUERY_STRING} =~ /(^|&)token=/">
	Require all granted
</If>

