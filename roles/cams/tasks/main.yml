- name: Install Zoneminder
  ansible.builtin.dnf:
    name:
      - ffmpeg
      - zoneminder-common
      - zoneminder-httpd
      - php-fpm
    state: present

- name: Configure MySQL for Zoneminder
  ansible.builtin.include_tasks:
    file: ../../mysql/tasks/configure-db.yml

- name: Disable Default Zoneminder Admin User
  community.mysql.mysql_query:
    login_unix_socket: "{{ mysql_socket }}"
    login_db: "{{ db_name }}"
    query: "UPDATE Users SET Enabled = 0 WHERE Username = 'admin' AND Enabled = 1"

- name: Add Initial Zoneminder Admin User
  community.mysql.mysql_query:
    login_unix_socket: "{{ mysql_socket }}"
    login_db: "{{ db_name }}"
    query: >-
      INSERT INTO Users (Username, Enabled, Stream, Events, Control, Monitors, `Groups`, Devices, Snapshots, System)
      VALUES (%s, 1, 'View', 'Edit', 'Edit', 'Create', 'Edit', 'Edit', 'Edit', 'Edit')
      ON DUPLICATE KEY UPDATE
        Enabled = 1, Stream = 'View', Events = 'Edit', Control = 'Edit',
        Monitors = 'Create', `Groups` = 'Edit', Devices = 'Edit',
        Snapshots = 'Edit', System = 'Edit'
    positional_args:
      - "{{ admin_user }}"

- name: Configure Zoneminder Authentication
  community.mysql.mysql_query:
    login_unix_socket: "{{ mysql_socket }}"
    login_db: "{{ db_name }}"
    query: "UPDATE Config SET Value = %s WHERE Name = %s"
    positional_args:
      - "{{ item.value }}"
      - "{{ item.name }}"
  loop:
    - { name: ZM_AUTH_TYPE, value: remote }
    - { name: ZM_AUTH_RELAY, value: hashed }
    - { name: ZM_OPT_USE_AUTH, value: "1" }
    - { name: ZM_AUTH_HASH_SECRET, value: "{{ zm_auth_hash_secret }}" }
  notify:
    - Restart Zoneminder

- name: Configure Apache for Zoneminder
  ansible.builtin.include_tasks:
    file: ../../http/tasks/configure-site.yml
  vars:
    site_auth: true

- name: Install Zoneminder Configuration
  ansible.builtin.template:
    src: 03-custom.conf
    dest: "/etc/zm/conf.d/03-custom.conf"
    owner: root
    group: apache
    mode: '0640'
  notify:
    - Restart Zoneminder

- name: Install Zoneminder Log Rotation Configuration
  ansible.builtin.template:
    src: zoneminder.logrotate
    dest: /etc/logrotate.d/zoneminder
    owner: root
    group: root
    mode: '0644'

- name: Ensure Local SELinux Policy Directory
  ansible.builtin.file:
    path: /usr/local/share/selinux
    state: directory
    mode: '0755'

- name: Install Zoneminder Local SELinux Policy
  ansible.builtin.template:
    src: zoneminder-local.cil
    dest: /usr/local/share/selinux/zoneminder-local.cil
    mode: '0644'
  register: zm_policy

- name: List Loaded SELinux Modules
  ansible.builtin.command:
    cmd: semodule -l
  register: selinux_modules
  changed_when: false

- name: Load Local SELinux Policy for Zoneminder
  ansible.builtin.command:
    cmd: semodule -i /usr/local/share/selinux/zoneminder-local.cil
  when: zm_policy.changed or 'zoneminder-local' not in selinux_modules.stdout_lines

- name: Restore SELinux Context of Web Cache Directory
  ansible.builtin.command:
    cmd: restorecon -Rv /var/cache/zoneminder
  register: zm_restorecon
  changed_when: zm_restorecon.stdout != ''

- name: Enable/Start Zoneminder
  ansible.builtin.systemd_service:
    name: zoneminder.service
    enabled: true
    masked: no
    state: started

- name: Configure PHP Timezone
  ansible.builtin.lineinfile:
    path: /etc/php.ini
    regexp: '^date.timezone = '
    insertafter: '^;date.timezone =$'
    line: 'date.timezone = Europe/London'
    state: present

- name: Enable/Start PHP FPM
  ansible.builtin.systemd_service:
    name: php-fpm.service
    enabled: true
    masked: no
    state: started
