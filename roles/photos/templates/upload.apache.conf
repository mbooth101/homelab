## {{ ansible_managed }}

# Videos can be bigger than Apache's default request body limit of 1 GiB,
# setting this to zero removes the limit for Immich
LimitRequestBody 0

# Wait up to 10 minutes for Immich (instead of Timeout's default of 60
# seconds), e.g. while it finishes handling a large upload
ProxyTimeout 600

