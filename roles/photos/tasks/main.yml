- name: Enable Immich Repository
  ansible.builtin.copy:
    src: mbooth-immich.repo
    dest: /etc/yum.repos.d/mbooth-immich.repo
    mode: '0644'

- name: Install Postgresql Extensions For Immich
  ansible.builtin.dnf:
    install_weak_deps: false
    name:
      - VectorChord
    state: present

# Check if extension is configured correctly first to avoid unnecessary restart
# of PostgreSQL -- reports changed if the required config is absent
- name: Check PostgreSQL Extension Configuration
  ansible.builtin.command:
    cmd: "grep '^shared_preload_libraries.*vchord.*$' /var/lib/pgsql/data/postgresql.auto.conf"
  register: preload_lib_config
  changed_when: preload_lib_config.rc != 0
  failed_when: False

# This extension must be loaded at PostgreSQL start up time
- name: Configure VectorChord Extension for PostgreSQL
  community.postgresql.postgresql_alter_system:
    param: shared_preload_libraries
    value: vchord,vector
  when: preload_lib_config.changed
  register: preload_lib

# A change to shared_preload_libraries requires PostgreSQL to be restarted
# immediately before we may use the extension
- name: Restart PostgreSQL
  ansible.builtin.systemd_service:
    name: postgresql.service
    state: restarted
  when: preload_lib.changed

# Install latest version always because we are building this RPM
# ourselves
- name: Install Immich
  ansible.builtin.dnf:
    install_weak_deps: false
    name:
      - ffmpeg
      - immich
      - python3-immich_ml
      - python3-immich_ml+cpu
    state: latest

- name: Configure PostgreSQL for Immich
  ansible.builtin.include_tasks:
    file: ../../postgres/tasks/configure-db.yml
  vars:
    db_extensions:
    - vchord
    - earthdistance

- name: Add Immich Admins Group
  ansible.builtin.group:
    name: immich-admins
    system: true
    state: present

- name: Configure Apache for Immich
  ansible.builtin.include_tasks:
    file: ../../http/tasks/configure-site.yml
  vars:
    site_proxy: true
    http_port: "{{ immich_http_port }}"

- name: Configure Immich as OpenID Connect Client
  ansible.builtin.include_tasks:
    file: ../../id/tasks/configure-client.yml
  vars:
    client_name: immich
    client_description: "Photo and Video Management"
    client_redirect_uris:
      - "https://{{ role_name }}.{{ domain }}/auth/login"
      - "https://{{ role_name }}.{{ domain }}/user-settings"
      - "https://{{ role_name }}.{{ domain }}/api/oauth/mobile-redirect"

- name: Ensure Immich Configuration Directory
  ansible.builtin.file:
    path: /etc/immich
    state: directory
    owner: root
    group: immich
    mode: '0750'

- name: Install Immich Configuration
  ansible.builtin.copy:
    content: "{{ immich_config | to_nice_json }}"
    dest: /etc/immich/config.json
    owner: root
    group: immich
    mode: '0640'
  vars:
    immich_config:
      map:
        enabled: false
      oauth:
        enabled: true
        clientId: "{{ client_id }}"
        clientSecret: "{{ client_secret }}"
        issuerUrl: "{{ id_issuer_url }}"
        autoLaunch: true
        scope: openid email profile roles
        roleClaim: immich_role
        mobileOverrideEnabled: true
        mobileRedirectUri: https://{{ role_name }}.{{ domain }}/api/oauth/mobile-redirect
      passwordLogin:
        enabled: false
      newVersionCheck:
        enabled: false
      server:
        externalDomain: "https://{{ role_name }}.{{ domain }}"
  notify:
    - Restart Immich

- name: Install Immich Environment File
  ansible.builtin.template:
    src: immich.env
    dest: "/etc/sysconfig/immich"
    mode: '0600'
  notify:
    - Restart Immich

- name: Enable/Start Immich
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    enabled: true
    masked: no
    state: started
  loop:
    - immich-machine-learning
    - immich
