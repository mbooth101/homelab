## {{ ansible_managed }}

# Require a Kerberos login for authentication. Browsers with a ticket use
# Negotiate (SPNEGO); everything else gets a Basic prompt whose password is
# checked against the KDC and the result validated with the site's keytab
<Location "/">
	AuthType GSSAPI
	AuthName "{{ domain }}"
	GssapiCredStore keytab:{{ http_keytab }}
	GssapiAllowedMech krb5
	GssapiSSLonly On
	GssapiBasicAuth On
	GssapiBasicAuthMech krb5
	GssapiNegotiateOnce On

	# Sets REMOTE_USER to the local name without the realm suffix
	GssapiLocalName On

	# Keep users logged in with an encrypted session cookie, rather than
	# re-authenticating against the KDC on every request
	GssapiUseSessions On
	GssapiSessionKey file:{{ http_session_key }}
	Session On
	SessionCookieName gssapi_session path=/;httponly;secure;

	Require valid-user
</Location>

