## {{ ansible_managed }}

<VirtualHost *:80>
{% if _site != host.name %}
	ServerName {{ _site }}.{{ domain }}
{% endif %}

{% if _site != host.name %}
	ErrorLog "logs/{{ _site }}_error_log"
	CustomLog "logs/{{ _site }}_access_log" combined
{% endif %}

	# The well-known URLs for certbot/letsencrypt
	AliasMatch "^/(.well-known/acme-challenge/.*)" "{{ www_root }}/acme/$1"

	# Redirect all URLs to their HTTPS equivilents except the well-known
	# URLs used for certbot/letsencrypt
	RewriteEngine on
	RewriteRule ^/((?!\.well-known/acme-challenge/).*)$ https://%{HTTP_HOST}/$1 [R=307]
</VirtualHost>

<VirtualHost _default_:443>
{% if _site != host.name %}
	ServerName {{ _site }}.{{ domain }}
{% endif %}

{% if _site != host.name %}
	ErrorLog "logs/{{ _site }}_error_log"
	CustomLog "logs/{{ _site }}_access_log" combined
{% endif %}

	SSLEngine on
	SSLHonorCipherOrder on
	SSLCipherSuite PROFILE=SYSTEM
	SSLProxyCipherSuite PROFILE=SYSTEM
	SSLCertificateFile /etc/letsencrypt/certs/{{ _site }}.{{ domain }}/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/certs/{{ _site }}.{{ domain }}/privkey.pem
	<FilesMatch "\.(cgi|shtml|phtml|php)$">
		SSLOptions +StdEnvVars
	</FilesMatch>

	# Include site-specific configuration
	IncludeOptional conf.d/includes.d/{{ _site }}/*.conf
</VirtualHost>

