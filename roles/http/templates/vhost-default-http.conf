## {{ ansible_managed }}

# Unencrypted default "catch-all" virtual host configuration
# All traffic to port 80 hits this
<VirtualHost *:80>
	# Serve the well-known URLs for certbot/letsencrypt
	AliasMatch "^/(.well-known/acme-challenge/.*)" "{{ www_root }}/acme/$1"

	# Redirect all URLs to their HTTPS equivilents except for the well-known URLs
	# used for certbot/letsencrypt
	RewriteEngine on
	RewriteRule ^/((?!\.well-known/acme-challenge/).*)$ https://%{HTTP_HOST}/ [R=307]
</VirtualHost>

