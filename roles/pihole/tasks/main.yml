- name: Configure Nginx for Pi-hole
  ansible.builtin.include_tasks:
    file: ../../proxy/tasks/configure-site.yml

- name: Enable Pi-hole Repository
  community.general.copr:
    state: enabled
    name: mbooth/Pi-hole

# Install latest version always because we are building this RPM
# ourselves
- name: Install Pi-hole
  ansible.builtin.dnf:
    name:
      - pihole
    state: latest

- name: Install Pi-hole Configuration
  ansible.builtin.template:
    src: pihole.toml.j2
    dest: "/etc/pihole/pihole.toml"
    owner: pihole
    group: pihole
    mode: '0644'
  notify:
    - Restart Pi-hole

- name: Enable/Start Pi-hole
  ansible.builtin.systemd_service:
    name: pihole-FTL.service
    enabled: true
    masked: no
    state: started

- name: Open Firewall for DNS
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
  with_items:
    - dns
  notify:
    - Reload Firewall

