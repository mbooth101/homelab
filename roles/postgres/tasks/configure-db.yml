# When including these tasks into a role, the following variables
# must be defined:
#
#  - db_name
#  - db_user
#  - db_password
# 
# The following additional variables are available:
#
#  - db_extensions: list of postgres extensions to enable for the database

- name: Create Database User
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"

- name: Create New Database
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
  register: db_creation

- name: Grant Database Privileges to User
  community.postgresql.postgresql_privs:
    login_db: "{{ db_name }}"
    type: database
    privs: ALL
    grant_option: false
    roles: "{{ db_user }}"
    state: present

- name: Grant Public Schema Privileges to User
  community.postgresql.postgresql_privs:
    login_db: "{{ db_name }}"
    type: schema
    privs: ALL
    objs: public
    grant_option: false
    roles: "{{ db_user }}"
    state: present

- name: Add Database Extensions
  community.postgresql.postgresql_ext:
    name: "{{ item }}"
    db: "{{ db_name }}"
    cascade: true
  loop: "{{ db_extensions | default([]) }}"
