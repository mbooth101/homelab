- name: Install PostgreSQL
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - python3-psycopg2
    state: present

- name: Initialise PostgreSQL
  ansible.builtin.command:
    cmd: postgresql-setup --initdb --unit postgresql
    creates: "/var/lib/pgsql/data/pg_hba.conf"

- name: Install PostgreSQL Configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: postgres
    group: postgres
    mode: '0600'
  loop:
    - { src: postgresql.conf.j2 , dest: "/var/lib/pgsql/data/postgresql.conf" }
    - { src: pg_hba.conf.j2 , dest: "/var/lib/pgsql/data/pg_hba.conf" }
  notify:
    - Restart PostgreSQL

- name: Enable/Start PostgreSQL
  ansible.builtin.systemd_service:
    name: postgresql.service
    enabled: true
    masked: no
    state: started
