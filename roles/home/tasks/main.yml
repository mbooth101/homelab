- name: Configure Nginx for Homer Dashboard
  ansible.builtin.include_tasks:
    file: ../../proxy/tasks/configure-site.yml

- name: Download Homer Dashboard
  ansible.builtin.get_url:
    url: "https://github.com/bastienwirtz/homer/releases/download/v{{ version }}/homer.zip"
    dest: "/srv/homer-v{{ version }}.zip"

- name: Install Homer Dashboard
  ansible.builtin.unarchive:
    src: "/srv/homer-v{{ version }}.zip"
    dest: "{{ www_root }}"
    remote_src: yes

- name: Ensure Homer Assets Directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "{{ item.state }}"
    mode: '0755'
  loop:
    - { path: /srv/www/home/assets/tools, state: absent }
    - { path: /srv/www/home/assets/services, state: directory }

- name: Copy Homer Assets
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/srv/www/home/assets/services"
    mode: '0644'
  with_fileglob:
    - "*.png"
  notify:
    - Reload Nginx

- name: Install Homer Configuration
  ansible.builtin.template:
    src: config.yml.j2
    dest: "/srv/www/home/assets/config.yml"
    mode: '0644'
