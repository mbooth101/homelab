- name: Configure Nginx for Cockpit
  ansible.builtin.include_tasks:
    file: ../../proxy/tasks/configure-site.yml

- name: Install Cockpit
  ansible.builtin.dnf:
    name:
      - cockpit
      - cockpit-machines
      - cockpit-pcp
      - cockpit-podman
      - cockpit-selinux
    state: present

- name: Install Cockpit Configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: cockpit-ws
    group: cockpit-ws
    mode: '0600'
  with_items:
    - { src: cockpit.conf.j2 , dest: "/etc/cockpit/cockpit.conf" }
    - { src: disallowed-users.j2 , dest: "/etc/cockpit/disallowed-users" }
  notify:
    - Restart Cockpit

- name: Ensure Cockpit Socket Overrides Directory
  ansible.builtin.file:
    state: directory
    path: /etc/systemd/system/cockpit.socket.d
    owner: root
    group: root
    mode: '0755'

- name: Install Cockpit Service Overrides
  ansible.builtin.template:
    src: cockpit.override.j2
    dest: "/etc/systemd/system/cockpit.socket.d/override.conf"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart Cockpit Socket

- name: Close Firewall for Direct Access to Cockpit
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: disabled
  with_items:
    - cockpit
  notify:
    - Reload Firewall

- name: Enable/Start Cockpit Socket
  ansible.builtin.systemd_service:
    name: cockpit.socket
    enabled: true
    masked: no
    state: started

- name: Enable/Start Perf Metric Logger
  ansible.builtin.systemd_service:
    name: pmlogger.service
    enabled: true
    masked: no
    state: started
