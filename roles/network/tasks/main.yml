# Tasks for creating a bonded ethernet connection from all the ports
# on the Intel NIC and creates a virtual bridge. The bonded connection
# and all virtual machines will be connected to the virtual bridge:
#
#               Server
#  Gateway     ┌─────────────────────────────────────────────┐
# ┌────────┐  ┌┴───────┐                                     │
# │ WAN    │<─│ enp2   │<───────────────┐                    │
# └────────┘  └┬───────┘                │                    │
#              │                        │                    │
#  Switch      │                        │         libvirt    │
# ┌────────┐  ┌┴───────┐  ┌───────┐     │        ┌────────┐  │
# │ Port 1 │─>│ enp4f0 │─>│       │  ┌───────┐  ┌┴──────┐ │  │
# │        │  └┬───────┘  │       │  │       │<─│ vnet0 │ │  │
# │        │  ┌┴───────┐  │       │  │       │  └┬──────┘ │  │
# │ Port 2 │─>│ enp4f1 │─>│       │  │       │  ┌┴──────┐ │  │
# │        │  └┬───────┘  │ bond0 │─>│bridge0│<─│ vnet1 │ │  │
# │        │  ┌┴───────┐  │       │  │       │  └┬──────┘ │  │
# │ Port 3 │─>│ enp4f2 │─>│       │  │       │  ┌┴──────┐ │  │
# │        │  └┬───────┘  │       │  │       │<─│ vnet2 │ │  │
# │        │  ┌┴───────┐  │       │  └───────┘  └┬──────┘ │  │
# │ Port 4 │─>│ enp4f3 │─>│       │              └────────┘  │
# │        │  └┬───────┘  └───────┘                          │
# │        │   └─────────────────────────────────────────────┘
# │ Port n │─> ...
# └────────┘

# This ensures the FQDN is correctly set and "hostname -f" gives the right
# answer
- name: Update Hosts File
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item }}"
  loop:
    - "{{ host.ipv4.address }} {{ host.fqdn }} {{ host.name }}"
    - "{{ host.ipv6.address }} {{ host.fqdn }} {{ host.name }}"

# Ensure the host name is set correctly based on the inventory host on which
# we're being run
- name: Set Host Name
  ansible.builtin.hostname:
    name: "{{ host.fqdn }}"
    use: systemd

# This should find all physical interfaces no matter how they are named and
# return them in a predictable order. Only "en*" devices are considered so that
# virtual ethernet devices (e.g. vnet* for VMs, veth* for containers) are never
# mistaken for physical ports. The first is the WAN port, the rest are bonded.
# Also used by the bootstrap role for the early boot network configuration.
- name: Create List of Wired Interfaces
  ansible.builtin.set_fact:
    ether_interfaces: "{{ ansible_interfaces | sort | map('extract', ansible_facts) | selectattr('type', 'eq', 'ether') | map(attribute='device') | select('match', '^en') | list }}"

# We use systemd-networkd instead of NetworkManager to make handover from the
# early boot environment easier
- name: Disable NetworkManager and ModemManager
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    enabled: false
    masked: true
    state: stopped
  loop:
    - NetworkManager
    - ModemManager
- name: Enable Systemd Network
  ansible.builtin.systemd_service:
    name: systemd-networkd.service
    enabled: true
    state: started

- name: Install Bridge Device Configuration
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/network/10-{{ item }}"
    mode: '0644'
  loop:
    - "bridge0.network"
    - "bridge0.netdev"
  notify: Reload Network

- name: Install Bond Device Configuration
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/network/20-{{ item }}"
    mode: '0644'
  loop:
    - "bond0.network"
    - "bond0.netdev"
  notify: Reload Network

- name: Install Bonded Port Configuration
  ansible.builtin.template:
    src: "port-bond.network"
    dest: "/etc/systemd/network/30-{{ item }}.network"
    mode: '0644'
  loop: "{{ ether_interfaces[1:] }}"
  notify: Reload Network

- name: Install WAN Port Configuration
  ansible.builtin.template:
    src: "port-wan.network"
    dest: "/etc/systemd/network/40-{{ wan_port }}.network"
    mode: '0644'
  vars:
    wan_port: "{{ ether_interfaces[0] }}"
  notify: Reload Network
