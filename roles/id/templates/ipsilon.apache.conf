## {{ ansible_managed }}

Alias /ui /usr/share/ipsilon/ui
Alias /.well-known /var/lib/ipsilon/root/public/well-known
Alias /cache /var/cache/ipsilon
Redirect /.well-known/webfinger /webfinger

WSGIScriptAlias / /usr/libexec/ipsilon/ipsilon
WSGIDaemonProcess {{ role_name }} user=ipsilon group=ipsilon home=/var/lib/ipsilon/root display-name=ipsilon-{{ role_name }}

# OpenID Connect clients send their secret in the Authorization header so it
# must be passed onto the WSGI process
WSGIPassAuthorization On

# Without this, getting the private key in jwcrypto/jwk.py, line 430, fails
# Fix from https://github.com/pyca/cryptography/issues/2299#issuecomment-197075190
WSGIApplicationGroup %{GLOBAL}

<Location "/">
	WSGIProcessGroup {{ role_name }}
</Location>

<Directory "/usr/libexec/ipsilon">
	Require all granted
</Directory>

<Directory "/usr/share/ipsilon">
	Options +SymLinksIfOwnerMatch
	Require all granted
</Directory>

<Directory "/var/lib/ipsilon/root/public/well-known">
	Require all granted
</Directory>

<Directory "/var/cache/ipsilon">
	SetHandler None
	AllowOverride None
	Require all granted
</Directory>

# Restrict the dynamic client registration URL to localhost only
<Location "/openidc/Registration">
	Require ip {{ host.ipv4.address }} {{ host.ipv6.address }} 127.0.0.1 ::1
</Location>

# Require a Kerberos login for authentication. Browsers with a ticket use
# Negotiate (SPNEGO); everything else gets a Basic prompt whose password is
# checked against the KDC
<Location "/login/gssapi/negotiate">
	AuthType GSSAPI
	AuthName "{{ domain }}"
	GssapiCredStore keytab:{{ http_keytab }}
	GssapiAllowedMech krb5
	GssapiSSLonly On
	GssapiBasicAuth On
	GssapiBasicAuthMech krb5
	GssapiNegotiateOnce On
	GssapiLocalName On
	Require valid-user

	ErrorDocument 401 /login/gssapi/unauthorized
	ErrorDocument 500 /login/gssapi/failed
</Location>

