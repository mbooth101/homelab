# When including these tasks into a role, the following variables are
# available:
#
# - client_name: short name by which to identify the client in Ipsilon
# - client_description: human readable description of the client application
# - client_redirect_uris: list of approved https redirect URIs
# - client_auth_method: (optional) how the client authenticates to the token
#   endpoint, client_secret_post (default) or client_secret_basic.
#
# After execution the following variables are made available to the calling
# role:
#
# - client_id: the name by which the app should identify itself to Ipsilon
# - client_secret: the credential that the client app uses to authenticate
#   itself with Ipsilon

- name: ID - Ensure OpenID Connect Client Directory
  ansible.builtin.file:
    path: /var/lib/ipsilon/clients
    state: directory
    owner: root
    group: root
    mode: '0700'

# The client is registered once and Ipsilon's response saved. To re-register
# (e.g. after changing the redirect URIs), delete the saved file and remove the
# old client in Ipsilon's admin pages
- name: ID - Register OpenID Connect Client
  ansible.builtin.uri:
    url: "https://id.{{ domain }}/openidc/Registration"
    method: POST
    body_format: json
    body:
      client_name: "{{ client_name }}"
      redirect_uris: "{{ client_redirect_uris }}"
      response_types: [ code ]
      grant_types: [ authorization_code ]
      token_endpoint_auth_method: "{{ client_auth_method | default('client_secret_post') }}"
    dest: "/var/lib/ipsilon/clients/{{ client_name }}.json"
    creates: "/var/lib/ipsilon/clients/{{ client_name }}.json"
    mode: '0600'
    status_code: 200

- name: ID - Read OpenID Connect Client Registration
  ansible.builtin.slurp:
    src: "/var/lib/ipsilon/clients/{{ client_name }}.json"
  register: _client_reg

- name: ID - Return OpenID Connect Client Credentials
  ansible.builtin.set_fact:
    client_id: "{{ (_client_reg.content | b64decode | from_json).client_id }}"
    client_secret: "{{ (_client_reg.content | b64decode | from_json).client_secret }}"

# Ensure user groups exist and the designated initial admin user is added to
# admin groups, as some services require an admin user, or require the first
# login to be an admin user
- name: ID - Create OpenID Connect Client User Groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop:
    - "{{ client_name }}-admins"
    - "{{ client_name }}-users"

- name: ID - Check For Admin User
  ansible.builtin.getent:
    database: passwd
    key: "{{ admin_user }}"
    fail_key: false

- name: ID - Add Admin User To Client's Admins User Group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: "{{ client_name }}-admins"
    append: true
  when: ansible_facts.getent_passwd[admin_user] is not none
