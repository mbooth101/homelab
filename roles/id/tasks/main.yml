- name: Install Ipsilon
  ansible.builtin.dnf:
    name:
      - ipsilon
      - ipsilon-openidc
      - ipsilon-authgssapi
      - python3-mod_wsgi
    state: present

- name: Find Ipsilon Package Directory
  ansible.builtin.command:
    cmd: "python3 -c 'import ipsilon, os; print(os.path.dirname(ipsilon.__file__))'"
  register: ipsilon_dir
  changed_when: false

- name: Install Custom Ipsilon Info Plugin and OpenID Connect Extension
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ ipsilon_dir.stdout }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: infonssmail.py, dest: info/infonssmail.py }
    - { src: roles.py, dest: providers/openidc/plugins/roles.py }
  notify:
    - Reload Apache

- name: Configure Apache for Ipsilon
  ansible.builtin.include_tasks:
    file: ../../http/tasks/configure-site.yml

- name: Configure Kerberos Keytab for Ipsilon
  ansible.builtin.include_tasks:
    file: ../../krb/tasks/configure-keytab.yml
  vars:
    keytab_principals: [ "HTTP/{{ role_name }}.{{ domain }}" ]
    keytab_path: "{{ http_keytab }}"
    keytab_owner: apache
    keytab_group: apache

- name: Create Ipsilon Instance
  ansible.builtin.command:
    cmd: >-
      /usr/bin/ipsilon-server-install --yes --root-instance
      --hostname {{ role_name }}.{{ domain }}
      --admin-user {{ admin_user }}
      --openidc yes --openidc-extensions roles
      --gssapi yes --gssapi-httpd-keytab {{ http_keytab }}
      --info-nssmail yes --info-nssmail-domain {{ domain }}
    creates: /var/lib/ipsilon/root
