- name: Install Ipsilon
  ansible.builtin.dnf:
    name:
      - ipsilon
      - ipsilon-openidc
      - ipsilon-authgssapi
      - ipsilon-authpam
      - python3-mod_wsgi
    state: present

- name: Configure Apache for Ipsilon
  ansible.builtin.include_tasks:
    file: ../../http/tasks/configure-site.yml

- name: Create Ipsilon Instance
  ansible.builtin.command:
    cmd: >-
      /usr/bin/ipsilon-server-install --yes --root-instance
      --hostname {{ role_name }}.{{ domain }}
      --admin-user {{ admin_user }}
      --openidc yes
      --gssapi yes --gssapi-httpd-keytab {{ http_keytab }}
      --pam yes
      --info-nss yes
    creates: /var/lib/ipsilon/root
