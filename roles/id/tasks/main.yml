- name: Install JVM
  ansible.builtin.dnf:
    name:
      - java-21-openjdk-headless
    state: present

- name: Add Keycloak System Group
  ansible.builtin.group:
    name: keycloak
    state: present
    system: true

- name: Add Keycloak System User
  ansible.builtin.user:
    name: keycloak
    comment: Keycloak User
    state: present
    system: true
    home: /opt/keycloak
    create_home: false
    group: keycloak

- name: Download Keycloak Tarball
  ansible.builtin.get_url:
    url: "https://github.com/keycloak/keycloak/releases/download/{{ kc_version }}/keycloak-{{ kc_version }}.tar.gz"
    dest: "/opt/keycloak-{{ kc_version }}.tar.gz"
  retries: 3
  delay: 2

- name: Extract Keycloak Tarball
  ansible.builtin.unarchive:
    remote_src: yes
    src: "/opt/keycloak-{{ kc_version }}.tar.gz"
    dest: "/opt"
    creates: "/opt/keycloak-{{ kc_version }}/version.txt"

- name: Create Versionless Symlink To Keycloak Root
  ansible.builtin.file:
    src: "/opt/keycloak-{{ kc_version }}"
    dest: "/opt/keycloak"
    state: link

- name: Configure PostgreSQL for Keycloak
  ansible.builtin.include_tasks:
    file: ../../postgres/tasks/configure-db.yml

- name: Configure Apache for Keycloak
  ansible.builtin.include_tasks:
    file: ../../http/tasks/configure-site.yml
  vars:
    site_proxy: true
    http_port: "{{ kc_http_port }}"

- name: Install Keycloak Configuration
  ansible.builtin.template:
    src: keycloak.conf
    dest: "/opt/keycloak/conf/keycloak.conf"
    mode: '0644'
  notify:
    - Restart Keycloak

# This is a tempprary account to be deleted after a proper admin account is
# created
- name: Bootstrap Temporary Keycloak Admin Account
  ansible.builtin.command:
    cmd: "/opt/keycloak/bin/kc.sh bootstrap-admin user --username temp-admin --password:env KCPW"
    creates: "/opt/keycloak/data"
  environment:
    KCPW: "{{ kc_admin_pw }}"
  register: bootstrap

- name: Set Ownership of Keycloak Files
  ansible.builtin.file:
    path: "/opt/keycloak-{{ kc_version }}"
    recurse: true
    group: keycloak
    owner: keycloak

- name: Install Service Unit for Keycloak
  ansible.builtin.template:
    src: keycloak.service
    dest: "/usr/lib/systemd/system/keycloak.service"
    mode: '0644'
  notify:
    - Restart Keycloak

- name: Enable/Start Keycloak Service
  ansible.builtin.systemd_service:
    name: keycloak.service
    daemon_reload: true
    enabled: true
    masked: no
    state: started

- name: Wait On Keycloak Start
  ansible.builtin.wait_for:
    host: "::1"
    port: "{{ kc_http_port }}"

- name: Create Keycloak Admin Account
  community.general.keycloak_user:
    auth_client_id: admin-cli
    auth_keycloak_url: "http://[::1]:{{ kc_http_port }}"
    auth_realm: master
    auth_username: temp-admin
    auth_password: "{{ kc_admin_pw }}"
    realm: master
    username: admin
    email: "keycloak-admin@{{ domain }}"
    emailVerified: true
    enabled: true
    credentials:
      - type: password
        value: "{{ kc_admin_pw }}"
        temporary: false
    state: present
  when: bootstrap.changed

- name: Grant Admin Role to Keycloak Admin Account
  community.general.keycloak_user_rolemapping:
    auth_client_id: admin-cli
    auth_keycloak_url: "http://[::1]:{{ kc_http_port }}"
    auth_realm: master
    auth_username: temp-admin
    auth_password: "{{ kc_admin_pw }}"
    realm: master
    target_username: admin
    roles:
      - name: admin
    state: present
  when: bootstrap.changed

- name: Delete Temporary Keycloak Admin Account
  community.general.keycloak_user:
    auth_client_id: admin-cli
    auth_keycloak_url: "http://[::1]:{{ kc_http_port }}"
    auth_realm: master
    auth_username: admin
    auth_password: "{{ kc_admin_pw }}"
    realm: master
    username: temp-admin
    state: absent

- name: Create Keycloak Realm
  community.general.keycloak_realm:
    auth_client_id: admin-cli
    auth_keycloak_url: "http://[::1]:{{ kc_http_port }}"
    auth_realm: master
    auth_username: admin
    auth_password: "{{ kc_admin_pw }}"
    realm: "{{ domain }}"
    enabled: true
    smtp_server:
      host: smtp.aa.net.uk
      port: "587"
      starttls: true
      auth: false
      from: "keycloak@{{ domain }}"
      fromDisplayName: "Keycloak"
      replyTo: "no-reply@{{ domain }}"
    login_with_email_allowed: false
    reset_password_allowed: true
    remember_me: true
    state: present

# Replace existing realm user profile, which had separate first and last name
# fields, with a single display name field
- name: Configure Realm User Profile
  community.general.keycloak_userprofile:
    auth_client_id: admin-cli
    auth_keycloak_url: "http://[::1]:{{ kc_http_port }}"
    auth_realm: master
    auth_username: admin
    auth_password: "{{ kc_admin_pw }}"
    realm: "{{ domain }}"
    config:
      kc_user_profile_config:
        - attributes:
          - name: username
            displayName: ${username}
            validations:
              length:
                min: 3
                max: 255
              username_prohibited_characters: {}
              up_username_not_idn_homograph: {}
            annotations: {}
            permissions:
              view: [ admin, user ]
              edit: [ admin, user ]
            multivalued: false
          - name: email
            displayName: ${email}
            validations:
              email: {}
              length:
                max: 255
            annotations: {}
            required:
              roles: [ user ]
            permissions:
              view: [ admin, user ]
              edit: [ admin, user ]
            multivalued: false
          - name: displayName
            displayName: ${displayName}
            validations:
              length:
                max: 255
              person_name_prohibited_characters: {}
            annotations: {}
            required:
              roles: [ user ]
            permissions:
              view: [ admin, user ]
              edit: [ admin, user ]
            multivalued: false
          groups:
            - name: user-metadata
              displayHeader: User metadata
              displayDescription: Attributes, which refer to user metadata
              annotations: {}
    state: present

- name: Add Display Name Mapper to User Profile Client Scope
  community.general.keycloak_clientscope:
    auth_client_id: admin-cli
    auth_keycloak_url: "http://[::1]:{{ kc_http_port }}"
    auth_realm: master
    auth_username: admin
    auth_password: "{{ kc_admin_pw }}"
    realm: "{{ domain }}"
    name: profile
    protocol: openid-connect
    protocol_mappers:
      - name: display name
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: displayName
          jsonType.label: String
          claim.name: display_name
          full.path: false
          id.token.claim: true
          access.token.claim: true
          lightweight.claim: false
          userinfo.token.claim: true
          introspection.token.claim: true
    state: present

- name: Create Keycloak Client Scope For Groups
  community.general.keycloak_clientscope:
    auth_client_id: admin-cli
    auth_keycloak_url: "http://[::1]:{{ kc_http_port }}"
    auth_realm: master
    auth_username: admin
    auth_password: "{{ kc_admin_pw }}"
    realm: "{{ domain }}"
    name: groups
    description: "Additional claims about the groups a subject belongs to"
    protocol: openid-connect
    protocol_mappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          claim.name: groups
          full.path: false
          id.token.claim: true
          access.token.claim: true
          lightweight.claim: false
          userinfo.token.claim: true
          introspection.token.claim: true
    state: present

# Must set all the scopes, any scopes unspecified here will lose their type :-(
- name: Set Default Client Scopes For Realm
  community.general.keycloak_clientscope_type:
    auth_client_id: admin-cli
    auth_keycloak_url: "http://[::1]:{{ kc_http_port }}"
    auth_realm: master
    auth_username: admin
    auth_password: "{{ kc_admin_pw }}"
    realm: "{{ domain }}"
    default_clientscopes: ['acr', 'basic', 'email', 'groups', 'profile', 'role_list']
    optional_clientscopes: ['address', 'microprofile-jwt', 'offline_access', 'organization', 'phone']

