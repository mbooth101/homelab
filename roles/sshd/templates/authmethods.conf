## {{ ansible_managed }}

# Disallow simple password auth, but allow these auth methods:
# - Public key
# - GSSAPI (aka Kerberos)
# - Complex keyboard interactive (e.g. password + OTP token), from the local
#   network only

PasswordAuthentication no

PubkeyAuthentication yes

GSSAPIAuthentication yes
GSSAPICleanupCredentials no

KbdInteractiveAuthentication no

UsePAM yes

Match Address {{ host.ipv4.subnet }},{{ host.ipv6.subnet }}
	KbdInteractiveAuthentication yes
