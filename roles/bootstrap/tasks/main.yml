- name: Switch Default Editor
  ansible.builtin.dnf:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
  loop:
    - { name: [ nano-default-editor, nano ], state: absent }
    - { name: [ vim-default-editor, vim-enhanced ], state: present }
  when: install_rpms

- name: Disable Plymouth Boot Theme
  ansible.builtin.command:
    cmd: "plymouth-set-default-theme details"
  notify: Regenerate Initramfs

- name: Configure Ansible Maintenance User
  ansible.builtin.include_tasks:
    file: configure-ansible-maint.yml

- name: Configure Network Connections
  ansible.builtin.include_tasks:
    file: configure-network.yml

- name: Configure Automatic LUKS Volume Decryption
  ansible.builtin.include_tasks:
    file: configure-luks-clevis.yml

# This must be the last thing we do because once disabled, we cannot
# reconnect as root to perform any further tasks -- subsequent playbook
# invokations will connect as the ansible-maint user created above
- name: Disable Root Account Password
  ansible.builtin.user:
    name: root
    password: '!'
    password_lock: true
  notify: Reboot Machine
