# Tasks for creating a bonded ethernet connection from all the ports
# on the Intel NIC and creates a virtual bridge. The bonded connection
# and all virtual machines will be connected to the virtual bridge:
#
#               Server
#  Gateway     ┌─────────────────────────────────────────────┐
# ┌────────┐  ┌┴───────┐                                     │
# │ WAN    │<─│ enp2   │<───────────────┐                    │
# └────────┘  └┬───────┘                │                    │
#              │                        │                    │
#  Switch      │                        │         libvirt    │
# ┌────────┐  ┌┴───────┐  ┌───────┐     │        ┌────────┐  │
# │ Port 1 │─>│ enp4f0 │─>│       │  ┌───────┐  ┌┴──────┐ │  │
# │        │  └┬───────┘  │       │  │       │<─│ vnet0 │ │  │
# │        │  ┌┴───────┐  │       │  │       │  └┬──────┘ │  │
# │ Port 2 │─>│ enp4f1 │─>│       │  │       │  ┌┴──────┐ │  │
# │        │  └┬───────┘  │ bond0 │─>│bridge0│<─│ vnet1 │ │  │
# │        │  ┌┴───────┐  │       │  │       │  └┬──────┘ │  │
# │ Port 3 │─>│ enp4f2 │─>│       │  │       │  ┌┴──────┐ │  │
# │        │  └┬───────┘  │       │  │       │<─│ vnet2 │ │  │
# │        │  ┌┴───────┐  │       │  └───────┘  └┬──────┘ │  │
# │ Port 4 │─>│ enp4f3 │─>│       │              └────────┘  │
# │        │  └┬───────┘  └───────┘                          │
# │        │   └─────────────────────────────────────────────┘
# │ Port n │─> ...
# └────────┘

# This ensures the FQDN is correctly set and "hostname -f" gives the right
# answer
- name: Update Hosts File
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item }}"
  loop:
    - "{{ host.ipv4.address }} {{ host.fqdn }} {{ host.name }}"
    - "{{ host.ipv6.address }} {{ host.fqdn }} {{ host.name }}"

# Ensure the host name is set correctly based on the inventory host on which
# we're being run
- name: Set Host Name
  ansible.builtin.hostname:
    name: "{{ host.fqdn }}"
    use: systemd

# This should find all physical interfaces no matter how they are
# named and return them in a predictable order
- name: Create List of Wired Interfaces
  ansible.builtin.set_fact:
    ether_interfaces: "{{ ansible_interfaces | sort | map('extract', ansible_facts) | selectattr('type', 'eq', 'ether') | map(attribute='device') }}"

# Configures early boot networking used for talking to LUKS key server to
# unlock encrypted system partitions
- name: Ensure Dracut Config Directory
  ansible.builtin.file:
    state: directory
    path: /etc/dracut.conf.d
    mode: '0755'
- name: Install Dracut Configuration
  ansible.builtin.template:
    src: dracut.conf
    dest: /etc/dracut.conf.d/10-early-boot-net.conf
    mode: '0444'
  notify: Regenerate Initramfs

# We use systemd-networkd instead of NetworkManager to make handover from the
# early boot environment easier
- name: Disable NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    enabled: false
    state: stopped
- name: Enable Systemd Network
  ansible.builtin.systemd_service:
    name: systemd-networkd.service
    enabled: true
    state: started

- name: Install Bonded Device and Network Configuration
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/network/10-{{ item }}"
    mode: '0644'
  loop:
    - "bond0.network"
    - "bond0.netdev"
  notify: Restart Network

- name: Install Bonded Port Network Configuration
  ansible.builtin.template:
    src: "bond0-port.network"
    dest: "/etc/systemd/network/10-{{ item }}.network"
    mode: '0644'
  loop: "{{ ether_interfaces[1:] }}"
  when: item.startswith('en')
  notify: Restart Network
