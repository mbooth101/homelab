# Tasks to be performed per encrypted block device

- name: List Existing Bindings for Encrypted Block Device
  ansible.builtin.command:
    cmd: "clevis luks list -d {{ luks_device.DEVNAME }}"
  register: luks_slots
  changed_when: False

- name: Verify LUKS Passphrase Validity
  ansible.builtin.command:
    cmd: "cryptsetup open --type luks2 --test-passphrase {{ luks_device.DEVNAME }}"
    stdin: "{{ luks_password }}"
  register: passphrase_validity
  changed_when: False

# Assumes the Tang server is running on IP xxx.xxx.xxx.11
# Ensure the DHCP assigns this IP to the Tang server in production
# In staging, the virt host has this IP as an alias
- name: Bind Encrypted Block Device to Dracut Unlocker
  ansible.builtin.command:
    cmd: "clevis luks bind -y -d {{ luks_device.DEVNAME }} -k- tang '{\"url\":\"{{ inventory_host4 | ansible.utils.ipsubnet | ansible.utils.ipaddr('11') | ansible.utils.ipaddr('address') }}:7500\"}'"
    stdin: "{{ luks_password }}"
  when:
    - passphrase_validity.rc == 0
    - luks_slots.rc == 0
    - luks_slots.stdout_lines | length == 0
  notify: Regenerate Initramfs
