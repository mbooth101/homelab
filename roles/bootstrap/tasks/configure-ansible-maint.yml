# Tasks for configuring the ansible-maint user that will be used
# for all subsequent non-bootstrap playbook invokations

- name: Add Ansible Group
  ansible.builtin.group:
    name: ansible-maint
    state: present
    system: true

- name: Add Ansible User
  ansible.builtin.user:
    name: ansible-maint
    comment: Ansible Maintenance
    state: present
    system: true
    append: true
    home: /
    create_home: false
    group: ansible-maint
    groups: wheel
    password: '!'
    password_lock: true

- name: Install Sudoers Configuration for Ansible Maint User
  ansible.builtin.template:
    src: sudoers
    dest: "/etc/sudoers.d/ansible-maint"
    mode: '0440'

- name: Ensure Authorized Keys Directory
  ansible.builtin.file:
    path: /etc/authorized_keys
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install Public Key
  ansible.posix.authorized_key:
    user: ansible-maint
    state: present
    path: /etc/ssh/authorized_keys/ansible-maint
    manage_dir: false
    key: "{{ lookup('file', '~/.ssh/id_home.pub') }}"
  notify: Reload SSHd

- name: Install Public Key Configuration
  ansible.builtin.template:
    src: ansible-maint.sshd.conf
    dest: "/etc/ssh/sshd_config.d/99-ansible-maint.conf"
    mode: '0600'
  notify: Reload SSHd

