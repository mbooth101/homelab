## {{ ansible_managed }}

jenkins:
  authorizationStrategy:
    globalMatrix:
      # Groups come from the jenkins_role claim: "admin" for members of the
      # jenkins-admins POSIX group, else "user" for members of jenkins-users.
      # Anonymous users have no access, so they are sent to the login page
      entries:
      - group:
          name: "authenticated"
          permissions:
          - "Job/Read"
          - "Overall/Read"
          - "View/Read"
      - group:
          name: "admin"
          permissions:
          - "Overall/Administer"
      - group:
          name: "user"
          permissions:
          - "Agent/Build"
          - "Agent/Configure"
          - "Agent/Connect"
          - "Agent/Create"
          - "Agent/Delete"
          - "Agent/Disconnect"
          - "Agent/Provision"
          - "Credentials/Create"
          - "Credentials/Delete"
          - "Credentials/ManageDomains"
          - "Credentials/Update"
          - "Credentials/View"
          - "Job/Build"
          - "Job/Cancel"
          - "Job/Configure"
          - "Job/Create"
          - "Job/Delete"
          - "Job/Discover"
          - "Job/Move"
          - "Job/Read"
          - "Job/ViewStatus"
          - "Job/Workspace"
          - "Overall/Read"
          - "Run/Delete"
          - "Run/Replay"
          - "Run/Update"
          - "SCM/Tag"
          - "View/Configure"
          - "View/Create"
          - "View/Delete"
          - "View/Read"
  clouds:
  - hypervisor:
      hypervisorSshPort: 0
      hypervisorSystemUrl: "system"
      hypervisorTransport: "unix"
      hypervisorType: "QEMU"
      maxOnlineSlaves: 2
  disabledAdministrativeMonitors:
  - "hudson.util.DoubleLaunchChecker"
  numExecutors: 0
  securityRealm:
    oic:
      clientId: "{{ client_id }}"
      clientSecret: "{{ client_secret }}"
      disableSslVerification: false
      emailFieldName: "email"
      fullNameFieldName: "name"
      groupIdStrategy: "caseSensitive"
      groupsFieldName: "jenkins_role"
      serverConfiguration:
        wellKnown:
          scopesOverride: "openid profile email roles"
          wellKnownOpenIDConfigurationUrl: "{{ id_issuer_url }}"
      userIdStrategy: "caseSensitive"
      userNameField: "preferred_username"
  # Agents connect over SSH or libvirt, so no inbound TCP agent port
  slaveAgentPort: -1
appearance:
  themeManager:
    theme: "darkSystem"
unclassified:
  email-ext:
    defaultContentType: "text/plain"
    mailAccount:
      smtpHost: "smtp.aa.net.uk"
      smtpPort: "587"
      useTls: true
  location:
    adminAddress: "Jenkins <jenkins@{{ domain }}>"
    url: "https://{{ role_name }}.{{ domain }}/"
  mailer:
    smtpHost: "smtp.aa.net.uk"
    smtpPort: "587"
    useTls: true
