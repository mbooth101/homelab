- name: Import GPG Key for Jenkins Repository
  ansible.builtin.rpm_key:
    key: https://pkg.jenkins.io/rpm-stable/repodata/repomd.xml.key
    state: present

- name: Enable Jenkins Repository
  ansible.builtin.copy:
    src: jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo
    mode: '0644'

- name: Install Jenkins
  ansible.builtin.dnf:
    name:
      - git
      - fontconfig
      - java-25-openjdk-headless
      - jenkins
    state: present

- name: Install Jenkins Plugin Manager
  ansible.builtin.get_url:
    url: "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ jenkins_plugin_manager_version }}/jenkins-plugin-manager-{{ jenkins_plugin_manager_version }}.jar"
    dest: "/usr/share/jenkins/jenkins-plugin-manager-{{ jenkins_plugin_manager_version }}.jar"
    checksum: "{{ jenkins_plugin_manager_checksum }}"
    mode: '0644'

- name: Check Installed Jenkins Plugins
  ansible.builtin.copy:
    content: "{{ jenkins_plugins | to_nice_yaml }}"
    dest: "/var/lib/jenkins/installed-plugins.yaml"
    mode: '0644'
  check_mode: true
  register: jenkins_plugin_check

- name: Install Jenkins Plugins
  ansible.builtin.command:
    argv: "{{ _cmd + jenkins_plugins }}"
  vars:
    _cmd:
      - java
      - -jar
      - "/usr/share/jenkins/jenkins-plugin-manager-{{ jenkins_plugin_manager_version }}.jar"
      - --war
      - /usr/share/java/jenkins.war
      - --plugin-download-directory
      - /var/lib/jenkins/plugins
      - --plugins
  become_user: jenkins
  when: jenkins_plugin_check is changed

- name: Record Installed Jenkins Plugins
  ansible.builtin.copy:
    content: "{{ jenkins_plugins | to_nice_yaml }}"
    dest: "/var/lib/jenkins/installed-plugins.yaml"
    mode: '0644'
  notify:
    - Restart Jenkins

- name: Configure Apache for Jenkins
  ansible.builtin.include_tasks:
    file: ../../http/tasks/configure-site.yml
  vars:
    site_proxy: true
    http_port: "{{ jenkins_http_port }}"

- name: Configure Keycloak for Jenkins
  ansible.builtin.include_tasks:
    file: ../../id/tasks/configure-client.yml
  vars:
    client:
      name: "Jenkins"
      description: "Continuous Integration"
      secret: "{{ jenkins_secret }}"
      redirect_uris: [ "/securityRealm/finishLogin" ]
      logout_uri: "/OicLogout"

- name: Ensure Jenkins Service Overrides Directory
  ansible.builtin.file:
    state: directory
    path: /etc/systemd/system/jenkins.service.d
    mode: '0755'

- name: Install Jenkins Service Overrides
  ansible.builtin.template:
    src: jenkins.override.conf
    dest: "/etc/systemd/system/jenkins.service.d/override.conf"
    mode: '0644'
  notify:
    - Restart Jenkins

- name: Enable/Start Jenkins
  ansible.builtin.systemd_service:
    name: jenkins.service
    enabled: true
    masked: no
    state: started

- name: Install Jenkins Configuration
  ansible.builtin.template:
    src: jenkins.yaml
    dest: /var/lib/jenkins/jenkins.yaml
    group: jenkins
    mode: '0640'
  notify:
    - Restart Jenkins

