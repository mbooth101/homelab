---
- hosts: all

  roles:
    - role: ssh
      tags: [ initial ]
    - role: cockpit
      vars:
        http_port: 9000
    - role: pihole
      vars:
        http_port: 9001
    - role: jenkins
      vars:
        http_port: 9002
    - home

  become: yes
  become_user: root
  become_method: sudo

  vars:
    domain: "matbooth.co.uk"
    subdomain: "{{ role_name }}.{{ domain }}"
    www_root: "/srv/www/{{ role_name }}"
