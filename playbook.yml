---
- hosts: all

  roles:
    - role: initial_setup
    - role: dns
    - role: dhcp
      vars:
        db_name: kea_dhcp
        db_user: kea
        db_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          66666536663062623134613938396635373233303631386138626666613538393936636334336238
          3533346466323363363033333333656264653034646662300a336337633434613139623038393234
          30346266633137663666653737633362313065643265356333313266663738636630616633386464
          6566363034313266300a663430356334366337343861663134663732303833353766653765343963
          32326436663130643532623463333932663664393033303537356536316438666662
    - role: cockpit
      vars:
        http_port: 9000
          #    - role: pihole
          #      vars:
          #        http_port: 9001
          #    - role: jenkins
          #      vars:
          #        http_port: 9002
          #    - role: openhab
          #      vars:
          #        http_port: 9003
          #    - role: home
  become: yes

  vars:
    domain: "matbooth.co.uk"
    host:
      name: "{{ inventory_hostname_short }}"
      fqdn: "{{ inventory_hostname_short }}.{{ domain }}"
      ipv4:
        bond:      "{{ inventory_host4 }}"
        bond_ip:   "{{ inventory_host4 | ansible.utils.ipaddr('address') }}"
        bridge:    "{{ inventory_host4 | ansible.utils.ipmath('1') }}/{{ inventory_host4 | ansible.utils.ipaddr('prefix') }}"
        bridge_ip: "{{ inventory_host4 | ansible.utils.ipaddr('address') | ansible.utils.ipmath('1') }}"
        subnet:  "{{ inventory_host4 | ansible.utils.ipsubnet }}"
        network: "{{ inventory_host4 | ansible.utils.ipaddr('network') }}"
        gateway: "{{ inventory_host4 | ansible.utils.ipsubnet | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}"
      ipv6:
        bond:      "{{ inventory_host6 }}"
        bond_ip:   "{{ inventory_host6 | ansible.utils.ipaddr('address') }}"
        bridge:    "{{ inventory_host6 | ansible.utils.ipmath('1') }}/{{ inventory_host6 | ansible.utils.ipaddr('prefix') }}"
        bridge_ip: "{{ inventory_host6 | ansible.utils.ipaddr('address') | ansible.utils.ipmath('1') }}"
        subnet:  "{{ inventory_host6 | ansible.utils.ipsubnet }}"
        network: "{{ inventory_host6 | ansible.utils.ipaddr('network') }}"
        gateway: "{{ inventory_host6 | ansible.utils.ipsubnet | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}"

    srv_fqdn: "{{ role_name }}.{{ domain }}"
    data_dir: "/srv/data/{{ role_name }}"
    www_root: "/srv/www/{{ role_name }}"
