---
- hosts: all

  roles:
    - role: initial_setup
    - role: dns
    - role: dhcp
      vars:
        db_name: kea_dhcp
        db_user: kea
        db_password: password
    - role: cockpit
      vars:
        http_port: 9000
          #    - role: pihole
          #      vars:
          #        http_port: 9001
    - role: jenkins
      vars:
        http_port: 9002
    - role: home
  become: yes

  vars:
    domain: "matbooth.co.uk"
    host:
      name: "{{ inventory_hostname_short }}"
      fqdn: "{{ inventory_hostname_short }}.{{ domain }}"
      cidr4: "{{ inventory_host4 }}"
      addr4: "{{ inventory_host4 | ansible.utils.ipaddr('address') }}"
      subn4: "{{ inventory_host4 | ansible.utils.ipsubnet }}"
      netw4: "{{ inventory_host4 | ansible.utils.ipaddr('network') }}"
      gate4: "{{ inventory_host4 | ansible.utils.ipsubnet | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}"

    srv_fqdn: "{{ role_name }}.{{ domain }}"
    db_root: "/srv/db/{{ role_name }}"
    www_root: "/srv/www/{{ role_name }}"
