# Keyboard layouts
keyboard --vckeymap=gb --xlayouts='gb'
# System language
lang en_GB.UTF-8

# Explicitly specify a reliable local mirror
url --url='@URL@'

# Network information
network --bootproto=static --device=bond0 --bondslaves=enp4s0f0,enp4s0f1,enp4s0f2,enp4s0f3 --bondopts=mode=balance-xor --gateway=@GATEWAY@ --ip=@IPADDR@ --nameserver=@GATEWAY@ --netmask=255.255.255.0 --ipv6=auto --activate
