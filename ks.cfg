raid /boot --level=RAID1 --device=boot --fstype="ext4" raid.11 raid.12
# Operating System: BTRFS Encrypted Software RAID array
part btrfs.21 --fstype="btrfs" --ondisk=@NVME0@ --size=1 --grow --encrypted --luks-version=luks2 --passphrase=@LUKSPW@
part btrfs.22 --fstype="btrfs" --ondisk=@NVME1@ --size=1 --grow --encrypted --luks-version=luks2 --passphrase=@LUKSPW@
btrfs / --label=fedora_@HOSTNAME@ --data=raid1 --metadata=raid1 btrfs.21 btrfs.22
# Data: BTRFS Encrypted Sofware RAID Array
part btrfs.41 --fstype="btrfs" --ondisk=sda --size=1 --grow --encrypted --luks-version=luks2 --passphrase=@LUKSPW@
part btrfs.42 --fstype="btrfs" --ondisk=sdb --size=1 --grow --encrypted --luks-version=luks2 --passphrase=@LUKSPW@
part btrfs.43 --fstype="btrfs" --ondisk=sdc --size=1 --grow --encrypted --luks-version=luks2 --passphrase=@LUKSPW@
part btrfs.44 --fstype="btrfs" --ondisk=sdd --size=1 --grow --encrypted --luks-version=luks2 --passphrase=@LUKSPW@
btrfs none --label=fedora_data --data=raid10 --metadata=raid10 btrfs.41 btrfs.42 btrfs.43 btrfs.44
btrfs /home --subvol --name=home LABEL=fedora_data
btrfs /var --subvol --name=var LABEL=fedora_data

timezone Europe/London --utc
rootpw --plaintext --allow-ssh @ROOTPW@
selinux --enforcing
firstboot --disabled

